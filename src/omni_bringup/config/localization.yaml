encoder_odometry:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    twist_covariance_diagonal: [1.0e-4, 1.0e-4, 1.0e-2]   # [vx, vy, vyaw] の分散

map_odom_corrector:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    publish_rate: 50.0           # [Hz]
    correction_gain: 0.3         # 1回の測定でずれを補正する割合
    max_measurement_age: 0.5     # [s]
