# センサー値は届くことより新しさを優先し、経路は後から起動したノードにも渡す
fake_mcu:
  ros__parameters:
    qos_overrides:
      /encoder_counts:
        publisher:
          reliability: best_effort

encoder_odometry:
  ros__parameters:
    qos_overrides:
      /encoder_counts:
        subscription:
          reliability: best_effort

navigation_manager:
  ros__parameters:
    qos_overrides:
      /planned_path:
        publisher:
          durability: transient_local
          depth: 1
